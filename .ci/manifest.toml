# Header written into the workflows that ci-infrastructure-generate renders
# from this file, so that regeneration keeps them REUSE-compliant.
[generated]
header = """
# SPDX-FileCopyrightText: 1996- European Centre for Medium-Range Weather Forecasts (ECMWF)
# SPDX-License-Identifier: Apache-2.0
"""

[package]
name = "fdb"
repo = "ecmwf/fdb"
visibility = "public"
compiler-inputs = ["cxx-compiler"]

[[deps]]
repo = "ecmwf/ecbuild"
package = "ecbuild"
ref = "develop"
compiler-inputs = []

[[deps]]
repo = "ecmwf/stack-dependencies"
package = "stack-deps"
ref = "master"
compiler-inputs = ["cxx-compiler"]

[[deps]]
repo = "ecmwf/eccodes"
package = "eccodes"
ref = "develop"
compiler-inputs = ["cxx-compiler"]

[[deps]]
repo = "ecmwf/eckit"
package = "eckit"
ref = "develop"
compiler-inputs = ["cxx-compiler"]

[[deps]]
repo = "ecmwf/metkit"
package = "metkit"
ref = "develop"
compiler-inputs = ["cxx-compiler"]

[matrix.build.defaults]
build-type = "RelWithDebInfo"
runs-on = "arc-runner-very-large"
ctest-args = '-j "$(nproc)"'

[[matrix.build.include]]
cxx-compiler = "clang++-18"
c-compiler = "clang-18"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-clang18:latest"
platform = "ubuntu-24.04"

[[matrix.build.include]]
cxx-compiler = "g++-13"
c-compiler = "gcc-13"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13:latest"
platform = "ubuntu-24.04"

[matrix.build]
triggers = ["upstream-change", "rebuild-request"]
# job-script = "./.ci/runner/build.sh.j2"
action = "./.github/actions/build-fdb"
forwarded-inputs = ["c-compiler", "cxx-compiler", "build-type"]
forwarded-deps-outputs = ["cmake-prefix-path"]
ctest = true

[matrix.build-hpc.defaults]
job-script = "./.ci/hpc/build.sh.j2"
#
[[matrix.build-hpc.include]]
cxx-compiler = "g++-8"
build-type = "RelWithDebInfo"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-gnu"
# gcc/old, not a version number: as of now gives you 8.5.0
# `module avail gcc` lists no 8.5.0 to pin directly.
modules = ["load prgenv/gnu", "unload gcc", "load gcc/old", "load cmake", "load ninja", "load uv"]
cc = "gcc"
cxx = "g++"
time = "00:40:00"

[matrix.build-hpc]
execution = "hpc-atos"
container-credentials = true
triggers = ["upstream-change", "rebuild-request"]
forwarded-deps-outputs = ["cmake-prefix-path"]
