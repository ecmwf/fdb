[workspace]
resolver = "2"
members = ["crates/fdb-sys", "crates/fdb", "tools/fdb-hammer"]

[workspace.package]
version = "5.25.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ecmwf/fdb"
rust-version = "1.90"
readme = "README.md"
keywords = ["ecmwf", "weather", "meteorology", "grib", "climate"]
categories = ["science", "database"]

[workspace.dependencies]
# Internal
fdb-sys = { version = "5.25", path = "crates/fdb-sys", default-features = false }
fdb = { version = "5.25", path = "crates/fdb" }

# Foundation crates
eckit-sys = { version = "2.5", default-features = false, features = ["aio"] }
eckit = { version = "2.5", default-features = false }
metkit-sys = { version = "1.22", default-features = false }
metkit = { version = "1.22", default-features = false, features = ["grib", "bufr"] }
eccodes-sys = { version = "2.49", default-features = false, features = ["eccodes-threads"] }

# Build tools
bindman = "0.2"
bindman-build = "0.2"
bindman-utils = "0.2"

# External
thiserror = "2"
cxx = "1.0"
cxx-build = "1.0"
parking_lot = "0.12"
tempfile = "3"
indexmap = "2"
