[package]
name = "fdb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Safe Rust wrapper for ECMWF's FDB (Fields DataBase)"
links = "fdb_rs"
build = "build.rs"

[features]
default = ["vendored", "grib", "tocfdb", "fdb-remote", "memfs"]
vendored = ["fdb-sys/vendored", "eckit/vendored", "metkit/vendored"]
system = ["fdb-sys/system", "eckit/system", "metkit/system"]

# Backends, forwarded to fdb-sys; the defaults match the FDB CMake defaults.
grib = ["fdb-sys/grib"]
tocfdb = ["fdb-sys/tocfdb"]
fdb-remote = ["fdb-sys/fdb-remote"]
memfs = ["fdb-sys/memfs"]

[build-dependencies]
bindman-utils.workspace = true

[dependencies]
fdb-sys.workspace = true
eckit.workspace = true
metkit.workspace = true
parking_lot.workspace = true
thiserror.workspace = true

[dev-dependencies]
eckit.workspace = true
metkit.workspace = true
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bench]]
name = "fdb_bench"
harness = false

[package.metadata.docs.rs]
