# Bans direct dependencies on *-sys crates outside the safe wrapper layer:
# examples, tools and applications must use the safe crates. `wrappers` lists
# the only crates allowed to depend on the banned crate.
[bans]
deny = [
    { name = "ecmwf-fdb-sys", wrappers = ["ecmwf-fdb"] },
    { name = "eckit-sys", wrappers = ["eckit", "ecmwf-fdb-sys", "metkit-sys", "eccodes-sys"] },
    { name = "metkit-sys", wrappers = ["metkit", "ecmwf-fdb-sys"] },
    { name = "eccodes-sys", wrappers = ["ecmwf-fdb-sys", "metkit-sys"] },
]
