[package]
name = "fdb-hammer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Benchmark and stress test tool for FDB"

[[bin]]
name = "fdb-hammer"
path = "src/main.rs"

[build-dependencies]
bindman-utils.workspace = true

[features]
default = ["vendored"]
vendored = ["fdb/vendored"]
system = ["fdb/system"]

[dependencies]
md-5 = "0.10"
clap = { version = "4", features = ["derive"] }
eckit.workspace = true
metkit.workspace = true
fdb = { path = "../../crates/fdb", default-features = false }
hostname = "0.4"
rand = "0.9"
nix = { version = "0.29", features = ["fs", "signal", "user"] }
crossbeam-channel = "0.5"
libc = "0.2"
